name: Bump version

# Raises the version in Cargo.toml (and the desktop app's Cargo.toml and
# tauri.conf.json), commits "Release vX.Y.Z", tags it and starts release.yml
# on the tag.
on:
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        options: [patch, minor, major]
        default: patch

jobs:
  bump:
    uses: firsttris/workflows/.github/workflows/bump-version.yml@v1
    with:
      bump: ${{ inputs.bump }}
      version-file: Cargo.toml
      extra-files: |
        apps/desktop/Cargo.toml
        apps/desktop/tauri.conf.json
    permissions:
      contents: write
      actions: write
