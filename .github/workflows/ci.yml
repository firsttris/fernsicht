name: CI

on:
  push:
  pull_request:
  schedule:
    # Nightly: long fuzzing and the soak test.
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ── Rust ──────────────────────────────────────────────────────────────
  rust-lint:
    name: Rust · fmt, clippy, benches compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      - run: shellcheck packaging/*.sh
      - name: FFmpeg and VAAPI headers (feature "vaapi")
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libavcodec-dev libavformat-dev libavutil-dev \
            libavfilter-dev libavdevice-dev libswscale-dev libswresample-dev libva-dev
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo bench --workspace --no-run

  rust-test:
    name: Rust · unit, property, integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: FFmpeg and VAAPI headers (feature "vaapi")
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libavcodec-dev libavformat-dev libavutil-dev \
            libavfilter-dev libavdevice-dev libswscale-dev libswresample-dev libva-dev libopus0
      # A sound server with a null output and a writable /dev/uinput: the
      # hardware-facing tests run for real here (they would make sound or
      # type on a desktop, so they need these variables to run at all).
      - name: Sound server and uinput for the device tests
        run: |
          sudo apt-get install -y -q pulseaudio
          pulseaudio --start --exit-idle-time=-1
          sudo chmod 666 /dev/uinput
      - run: cargo test --workspace --exclude fernsicht-e2e --features fernsicht-input/uinput
        env:
          PROPTEST_CASES: "1024"
          # libopus is loaded at runtime; the audio tests must not skip.
          FERNSICHT_REQUIRE_OPUS: "1"
          FERNSICHT_PULSE_TEST: "1"
          FERNSICHT_UINPUT_TEST: "1"
      # Builds the hardware tests; without a GPU they skip themselves (and
      # NVENC/NVDEC must fail cleanly without the NVIDIA driver).
      - run: cargo test -p fernsicht-codec --features vaapi,nvidia
      # KMS capture: selection logic and error paths (capturing itself
      # needs a monitor and CAP_SYS_ADMIN, see docs/kms-capture.md).
      - run: cargo test -p fernsicht-capture -p fernsicht-host-agent --features fernsicht-capture/kms,fernsicht-host-agent/kms
      # Vulkan renderer on the software rasterizer (llvmpipe): NV12 → RGB,
      # letterboxing, error paths. REQUIRE makes a missing driver a failure
      # instead of a silent skip.
      # The validation layers check every Vulkan call, including
      # synchronization; any message they print fails the job.
      - name: Software Vulkan (llvmpipe) and the validation layers
        run: sudo apt-get install -y -q mesa-vulkan-drivers vulkan-validationlayers
      - name: Vulkan renderer, validated
        shell: bash
        env:
          FERNSICHT_REQUIRE_VULKAN: "1"
          FERNSICHT_VULKAN_DEVICE: llvmpipe
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
          VK_LAYER_VALIDATE_SYNC: "1"
        run: |
          set -o pipefail
          cargo test -p fernsicht-render --features vulkan -- --nocapture 2>&1 | tee vulkan.log
          # Screen input for NVENC: the shader and device setup. llvmpipe
          # here cannot import DMA-BUFs, so the conversion itself runs on
          # the GPU runners (FERNSICHT_REQUIRE_DMABUF there).
          cargo test -p fernsicht-gpu -- --nocapture 2>&1 | tee -a vulkan.log
          if grep -q "Validation Error\|Validation Warning" vulkan.log; then
            grep -A6 "Validation Error\|Validation Warning" vulkan.log | head -60
            exit 1
          fi

  rust-e2e:
    name: Rust · end-to-end (impaired network, binaries)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Raise UDP buffer limits like a tuned host
        run: sudo sysctl -w net.core.rmem_max=8388608 net.core.wmem_max=8388608
      - name: libopus (loaded at runtime by the sound tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q libopus0
      - run: cargo test -p fernsicht-e2e
        env:
          FERNSICHT_REQUIRE_OPUS: "1"

  rust-coverage:
    name: Rust · coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: sudo sysctl -w net.core.rmem_max=8388608 net.core.wmem_max=8388608
      - name: libopus, a sound server and uinput (see rust-test)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libopus0 pulseaudio
          pulseaudio --start --exit-idle-time=-1
          sudo chmod 666 /dev/uinput
      # CLI entry points are exercised by the binary E2E tests but run as
      # separate processes, so they are excluded from the measurement. So
      # is the Vulkan code in crates/gpu (like the renderer's, which is
      # behind a feature): it needs a GPU driver and is tested on the GPU
      # runners.
      - run: >
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          --ignore-filename-regex 'main\.rs$|crates/gpu/' --fail-under-lines 90
        env:
          FERNSICHT_REQUIRE_OPUS: "1"
          FERNSICHT_PULSE_TEST: "1"
          FERNSICHT_UINPUT_TEST: "1"
      - run: cargo llvm-cov report --summary-only --ignore-filename-regex 'main\.rs$|crates/gpu/' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: lcov.info

  fuzz:
    name: Fuzz · ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [proto_decode, reassembler, fec_roundtrip, synthetic_decode]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz (60 s per push, 15 min nightly)
        working-directory: fuzz
        run: |
          secs=60
          if [ "${{ github.event_name }}" = "schedule" ]; then secs=900; fi
          # +nightly overrides rust-toolchain.toml (stable); the prebuilt
          # cargo-fuzz would otherwise default to a musl target.
          cargo +nightly fuzz run ${{ matrix.target }} --target x86_64-unknown-linux-gnu \
            -- -max_total_time=$secs -rss_limit_mb=1024
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts

  soak:
    name: Rust · soak (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo sysctl -w net.core.rmem_max=8388608 net.core.wmem_max=8388608
      - run: cargo test -p fernsicht-e2e --release --test soak -- --ignored

  # ── Desktop app ───────────────────────────────────────────────────────
  # Its own Cargo workspace (WebKitGTK, the built UI); its test drives a real
  # host and the real client program through the app's logic.
  desktop:
    name: Desktop app · fmt, clippy, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fernsicht/client-ui build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop
            .
      - name: WebKitGTK (Tauri)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - run: cargo test

  # ── Web ───────────────────────────────────────────────────────────────
  web-lint:
    name: Web · format, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm -r typecheck
      - run: pnpm -r build

  web-unit:
    name: Web · unit & component (coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: coverage

  web-e2e:
    name: Web · browser E2E & accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fernsicht/web-e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/e2e/playwright-report
            web/e2e/test-results
