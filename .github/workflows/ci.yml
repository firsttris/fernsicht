name: CI

# Third-party actions are pinned to a commit, with the release in a comment.
# System packages come through apt-install (firsttris/workflows), which keeps
# them in the Actions cache: the runners' Ubuntu mirror is sometimes very slow.

on:
  push:
    # main and the session branch; any other branch runs through its pull
    # request (once, not a second time for the push).
    branches: ["main", "ccr-*"]
    # Documentation alone needs no build (docs.yml builds the site)
    paths-ignore: ["**.md", "docs/**", "LICENSE", "NOTICE", "mkdocs.yml", "requirements-docs.txt"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE", "NOTICE", "mkdocs.yml", "requirements-docs.txt"]
  schedule:
    # Nightly: long fuzzing and the soak test.
    - cron: "17 2 * * *"
  workflow_call: # release.yml runs the same checks before it builds
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels an outdated run;
# runs for a release (called from release.yml) always finish.
concurrency:
  group: ci-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Which parts changed: a change to the web UIs alone skips the Rust jobs
  # and the other way round (scripts/ci-changes.sh).
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        run: scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}

  # ── Rust ──────────────────────────────────────────────────────────────
  rust-lint:
    name: Rust · fmt, clippy, benches compile
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable branch, 2026-09-11
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      - run: shellcheck packaging/*.sh scripts/*.sh
      - name: FFmpeg and VAAPI headers (feature "vaapi")
        uses: firsttris/workflows/actions/apt-install@v1
        with:
          packages: >-
            libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev
            libavdevice-dev libswscale-dev libswresample-dev libva-dev
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo bench --workspace --no-run
      # The oldest Rust the crates promise to build with (rust-version).
      - name: Minimum supported Rust
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          cargo +"$msrv" check --workspace --all-targets

  # The whole workspace's tests, end to end included, run once: measured
  # for coverage, with the property tests at CI's strength and the device
  # tests for real.
  rust-test:
    name: Rust · tests and coverage
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable branch, 2026-09-11
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-llvm-cov
      - name: Raise UDP buffer limits like a tuned host
        run: sudo sysctl -w net.core.rmem_max=8388608 net.core.wmem_max=8388608
      # libopus is loaded at runtime. A sound server with a null output and
      # a writable /dev/uinput: the hardware-facing tests run for real here
      # (they would make sound or type on a desktop, so they need these
      # variables to run at all).
      - name: libopus and a sound server
        uses: firsttris/workflows/actions/apt-install@v1
        with:
          packages: libopus0 pulseaudio
      - name: Sound server and uinput
        run: |
          pulseaudio --start --exit-idle-time=-1
          sudo chmod 666 /dev/uinput
          # The gamepad test reads its virtual pad back from /dev/input.
          echo 'SUBSYSTEM=="input", KERNEL=="event*", MODE="0666"' |
            sudo tee /etc/udev/rules.d/99-fernsicht-test.rules
          sudo udevadm control --reload-rules
          # A DualSense through uhid needs the kernel's uhid and
          # hid-playstation, which the runner's kernel keeps in its extra
          # modules: required where they load.
          sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" ||
            echo "::warning::no extra modules for $(uname -r)"
          # SDL reads the DualSense through hidraw, as Steam does.
          sudo modprobe uhid || true
          if [ -e /dev/uhid ]; then
            sudo chmod 666 /dev/uhid
            echo 'SUBSYSTEM=="hidraw", KERNEL=="hidraw*", MODE="0666"' |
              sudo tee -a /etc/udev/rules.d/99-fernsicht-test.rules
            sudo udevadm control --reload-rules
            echo "FERNSICHT_REQUIRE_UHID=1" >> "$GITHUB_ENV"
          else
            echo "::warning::no uhid: the DualSense tests skip"
          fi
          if sudo modprobe hid-playstation; then
            echo "FERNSICHT_REQUIRE_DUALSENSE=1" >> "$GITHUB_ENV"
          else
            echo "::warning::no hid-playstation: its DualSense test skips"
          fi
      # SDL3 for the gamepad tests: the build the AppImage carries.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/sdl3
          key: sdl3-${{ runner.os }}-${{ hashFiles('packaging/sdl3.sh') }}
      - name: SDL3's build dependencies
        uses: firsttris/workflows/actions/apt-install@v1
        with:
          packages: libudev-dev cmake
      - name: SDL3 (packaging/sdl3.sh)
        run: |
          ./packaging/sdl3.sh ~/sdl3
          echo "LD_LIBRARY_PATH=$HOME/sdl3/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "FERNSICHT_REQUIRE_SDL=1" >> "$GITHUB_ENV"
      # Two desktops for the clipboard tests: headless Sway (wlroots' data
      # control; KWin's is tried by hand), one for the host, one for the
      # client.
      - name: Sway
        uses: firsttris/workflows/actions/apt-install@v1
        with:
          packages: sway
      - name: Two headless Wayland compositors
        run: |
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          for i in 1 2; do
            env -u WAYLAND_DISPLAY WLR_BACKENDS=headless WLR_RENDERER=pixman \
              WLR_LIBINPUT_NO_DEVICES=1 LIBSEAT_BACKEND=noop \
              sway -c /dev/null > "/tmp/sway$i.log" 2>&1 &
            for _ in $(seq 50); do
              [ "$(find "$XDG_RUNTIME_DIR" -maxdepth 1 -name 'wayland-*' ! -name '*.lock' | wc -l)" -ge "$i" ] && break
              sleep 0.2
            done
          done
          mapfile -t sockets < <(find "$XDG_RUNTIME_DIR" -maxdepth 1 -name 'wayland-*' ! -name '*.lock' | sort)
          if [ "${#sockets[@]}" -lt 2 ]; then cat /tmp/sway*.log; exit 1; fi
          echo "FERNSICHT_WAYLAND_SOCKET=${sockets[0]}" >> "$GITHUB_ENV"
          echo "FERNSICHT_WAYLAND_SOCKET_2=${sockets[1]}" >> "$GITHUB_ENV"
      # Failed tests become annotations: readable without a login. CLI entry
      # points run as separate processes in the binary tests, so they are
      # not measured; nor is the Vulkan code in crates/gpu, which needs a
      # GPU driver and is tested on the GPU runners.
      - run: >
          scripts/annotate-failures.sh
          cargo llvm-cov --workspace
          --features fernsicht-input/uinput,fernsicht-input/gamepad
          --lcov --output-path lcov.info
          --ignore-filename-regex 'main\.rs$|crates/gpu/' --fail-under-lines 90
        env:
          PROPTEST_CASES: "1024"
          FERNSICHT_REQUIRE_OPUS: "1"
          FERNSICHT_PULSE_TEST: "1"
          FERNSICHT_UINPUT_TEST: "1"
      - run: cargo llvm-cov report --summary-only --ignore-filename-regex 'main\.rs$|crates/gpu/' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage
          path: lcov.info

  # What the test run above leaves out: the hardware backends' builds, KMS
  # capture's logic, and the Vulkan renderer on a software GPU.
  rust-features:
    name: Rust · hardware features, Vulkan (software)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable branch, 2026-09-11
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: FFmpeg and VAAPI headers (feature "vaapi")
        uses: firsttris/workflows/actions/apt-install@v1
        with:
          packages: >-
            libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev
            libavdevice-dev libswscale-dev libswresample-dev libva-dev
      # Builds the hardware tests; without a GPU they skip themselves (and
      # NVENC/NVDEC must fail cleanly without the NVIDIA driver).
      - run: scripts/annotate-failures.sh cargo test -p fernsicht-codec --features vaapi,nvidia
      # KMS capture: selection logic and error paths (capturing itself
      # needs a monitor and CAP_SYS_ADMIN, see docs/kms-capture.md).
      - run: scripts/annotate-failures.sh cargo test -p fernsicht-capture -p fernsicht-host-agent --features fernsicht-capture/kms,fernsicht-host-agent/kms
      # Vulkan renderer on the software rasterizer (llvmpipe): NV12 → RGB,
      # letterboxing, error paths. REQUIRE makes a missing driver a failure
      # instead of a silent skip.
      # The validation layers check every Vulkan call, including
      # synchronization; any message they print fails the job.
      - name: Software Vulkan (llvmpipe) and the validation layers
        uses: firsttris/workflows/actions/apt-install@v1
        with:
          packages: mesa-vulkan-drivers vulkan-validationlayers
      - name: Vulkan renderer, validated
        shell: bash
        env:
          FERNSICHT_REQUIRE_VULKAN: "1"
          FERNSICHT_VULKAN_DEVICE: llvmpipe
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
          VK_LAYER_VALIDATE_SYNC: "1"
        run: |
          set -o pipefail
          cargo test -p fernsicht-render --features vulkan -- --nocapture 2>&1 | tee vulkan.log
          # Screen input for NVENC: the shader and device setup. llvmpipe
          # here cannot import DMA-BUFs, so the conversion itself runs on
          # the GPU runners (FERNSICHT_REQUIRE_DMABUF there).
          cargo test -p fernsicht-gpu -- --nocapture 2>&1 | tee -a vulkan.log
          if grep -q "Validation Error\|Validation Warning" vulkan.log; then
            grep -A6 "Validation Error\|Validation Warning" vulkan.log | head -60
            exit 1
          fi

  fuzz:
    name: Fuzz · ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [proto_decode, reassembler, fec_roundtrip, synthetic_decode]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable branch, 2026-09-11
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-fuzz
      - name: Fuzz (60 s per push, 15 min nightly)
        working-directory: fuzz
        run: |
          secs=60
          if [ "${{ github.event_name }}" = "schedule" ]; then secs=900; fi
          # +nightly overrides rust-toolchain.toml (stable); the prebuilt
          # cargo-fuzz would otherwise default to a musl target.
          cargo +nightly fuzz run ${{ matrix.target }} --target x86_64-unknown-linux-gnu \
            -- -max_total_time=$secs -rss_limit_mb=1024
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts

  soak:
    name: Rust · soak (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable branch, 2026-09-11
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo sysctl -w net.core.rmem_max=8388608 net.core.wmem_max=8388608
      - run: cargo test -p fernsicht-e2e --release --test soak -- --ignored

  # ── Desktop app ───────────────────────────────────────────────────────
  # Its own Cargo workspace (WebKitGTK, the built UI); its test drives a real
  # host and the real client program through the app's logic, and checks
  # the TypeScript types generated from the Rust ones.
  desktop:
    name: Desktop app · fmt, clippy, tests
    needs: [changes, web-lint]
    # web-lint is skipped when only Rust changed; then the UI is built here.
    if: >-
      !cancelled() && needs.web-lint.result != 'failure' &&
      (needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.web-lint.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          # The artifact keeps paths below web/ (the UIs' common folder).
          path: web
      - if: needs.web-lint.result != 'success'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: needs.web-lint.result != 'success'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - if: needs.web-lint.result != 'success'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @fernsicht/client-ui build
          pnpm --filter @fernsicht/viewer build
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable branch, 2026-09-11
        with:
          toolchain: stable
          components: rustfmt, clippy
      # The AppImage carries the stream window and the host as "sidecars";
      # the release builds the real ones (packaging/appimage.sh), these
      # checks only need files there.
      - name: Stand-ins for the bundled programs
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p binaries
          for bin in fernsicht-client fernsicht-host-agent; do
            printf '#!/bin/sh\nexit 1\n' > "binaries/$bin-$triple"
            chmod +x "binaries/$bin-$triple"
          done
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            apps/desktop
            .
      - name: WebKitGTK (Tauri)
        uses: firsttris/workflows/actions/apt-install@v1
        with:
          packages: >-
            libwebkit2gtk-4.1-dev libsoup-3.0-dev
            libjavascriptcoregtk-4.1-dev librsvg2-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - run: cargo test
      # Its own rust-version: Tauri needs a newer Rust than the other crates.
      - name: Minimum supported Rust
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          cargo +"$msrv" check --all-targets

  # ── Web ───────────────────────────────────────────────────────────────
  # Builds the UIs once; the desktop app and the browser tests take them
  # from here.
  web-lint:
    name: Web · format, lint, typecheck, build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check # Biome: format and lint
      - run: pnpm -r typecheck
      - run: pnpm -r build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-dist
          path: |
            web/client-ui/dist
            web/viewer/dist
          retention-days: 1

  web-unit:
    name: Web · unit & component (coverage)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-coverage
          path: coverage

  web-e2e:
    name: Web · browser E2E & accessibility
    needs: web-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          # The artifact keeps paths below web/ (the UIs' common folder).
          path: web
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser, per Playwright version (the lockfile pins it).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @fernsicht/web-e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          # The UIs come built from web-lint.
          FERNSICHT_UI_BUILT: "1"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/e2e/playwright-report
            web/e2e/test-results
