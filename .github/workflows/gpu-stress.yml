name: GPU stress

# On demand: runs the Vulkan renderer tests many times on one GPU machine
# to catch rare crashes (e.g. in the driver), with the Vulkan setup steps
# and loader messages logged, so a crash shows where it happened.
#   gh workflow run gpu-stress.yml -f gpu=nvidia -f runs=50 -f gdb=true
on:
  workflow_dispatch:
    inputs:
      gpu:
        description: "Machine: amd or nvidia"
        default: nvidia
      runs:
        description: "How many times"
        default: "50"
      gdb:
        description: "Run under gdb, backtrace on a crash"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  stress:
    name: Vulkan renderer × ${{ inputs.runs }} · ${{ inputs.gpu }}
    if: github.repository == 'firsttris/fernsicht'
    runs-on: [self-hosted, linux, "gpu-${{ inputs.gpu }}"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the tests
        run: cargo test -p fernsicht-render --features vulkan --test vulkan --no-run
      # The job runs as the container's root; gdb stays until the runner
      # container is recreated.
      - name: Install gdb
        if: inputs.gdb
        run: command -v gdb || dnf install -y -q gdb
      - name: Run them ${{ inputs.runs }} times
        env:
          FERNSICHT_REQUIRE_VULKAN: "1"
          RUST_LOG: fernsicht_render=debug
          VK_LOADER_DEBUG: error,warn
          DEBUGINFOD_URLS: ""
          RUNS: ${{ inputs.runs }}
          GDB: ${{ inputs.gdb }}
        run: |
          bin=$(cargo test -p fernsicht-render --features vulkan --test vulkan --no-run --message-format=json 2>/dev/null \
            | jq -r 'select(.profile.test == true and .target.name == "vulkan") | .executable')
          run() {
            if [ "$GDB" = true ]; then
              # No symbol downloads (debuginfod would fetch every library's).
              timeout 120 gdb -q -batch -return-child-result \
                -iex "set debuginfod enabled off" -ex run -ex "thread apply all bt 15" \
                --args "$bin" --test-threads=1 --nocapture
            else
              timeout 60 "$bin" --test-threads=1 --nocapture
            fi
          }
          failed=0
          retried=0
          for i in $(seq "$RUNS"); do
            if ! run > run.log 2>&1 || grep -q "SIGSEGV\|received signal" run.log; then
              failed=$((failed + 1))
              echo "::group::run $i failed (exit $?)"
              tail -80 run.log
              echo "::endgroup::"
            fi
            retried=$((retried + $(grep -c "retrying" run.log || true)))
            if [ $((i % 10)) -eq 0 ]; then echo "$i runs, $failed failed, $retried retries"; fi
          done
          echo "### Vulkan renderer: $failed of $RUNS runs failed, device creation retried $retried times" >> "$GITHUB_STEP_SUMMARY"
          echo "$failed of $RUNS runs failed, device creation retried $retried times"
          test "$failed" -eq 0
