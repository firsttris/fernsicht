name: GPU

# Runs on the self-hosted runners on the owner's machines (docs/gpu-runner.md).
# Self-hosted runners execute repository code locally, so this workflow
# never runs for pull requests (forks included): only for pushes to main by
# people with write access, nightly, and on demand.
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "apps/**"
      - "tests/**"
      - "Cargo.*"
      - "dev/**"
      - ".github/workflows/gpu.yml"
  schedule:
    # Nightly, to catch Mesa/NVIDIA driver updates that break GPU code.
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A push that leaves the GPU code alone (network, protocol, input, sound,
  # web viewer, docs) keeps the runners free: they test what only they can
  # (scripts/ci-changes.sh). Nightly and on demand everything runs.
  changes:
    name: GPU code changed?
    if: github.repository == 'firsttris/fernsicht' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      gpu: ${{ steps.diff.outputs.gpu }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        run: scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}

  gpu:
    name: GPU · ${{ matrix.gpu }}
    needs: changes
    if: needs.changes.outputs.gpu == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Machines with a runner, as a repository variable (Settings →
        # Secrets and variables → Actions → Variables), e.g. ["amd","nvidia"].
        # Without it only the AMD machine is used, so no job waits for a
        # runner that does not exist yet.
        gpu: ${{ fromJSON(vars.GPU_RUNNERS || '["amd"]') }}
    # A machine that is switched off leaves its job queued (GitHub gives up
    # after 24 h); cancel it in the Actions tab if you don't need it.
    runs-on: [self-hosted, linux, "gpu-${{ matrix.gpu }}"]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: GPU capabilities and hardware H.264 smoke test
        run: dev/gpu-check.sh --expect ${{ matrix.gpu }} --summary "$GITHUB_STEP_SUMMARY"
      # Everything but the GPU's own tests, in parallel. fernsicht-gpu runs
      # below, one test at a time: Vulkan tests side by side on the NVIDIA
      # driver once spun forever here (chroma_is_sited_left, 2026-10-11).
      - name: Tests on this machine
        timeout-minutes: 15
        run: >
          scripts/annotate-failures.sh cargo test --workspace
          --exclude fernsicht-e2e --exclude fernsicht-gpu
      # AMD: decoded pictures shown without a copy (DMA-BUF import);
      # NVIDIA: CPU upload and screen input (Vulkan → CUDA) on the
      # proprietary driver.
      # The hardware steps below run even when an earlier one failed, so
      # one red step does not hide the results of the others. Each has its
      # own time limit: a GPU that hangs (a driver wait spinning forever)
      # fails its step in minutes instead of holding the runner.
      - name: Vulkan renderer on this GPU
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          FERNSICHT_GPU: ${{ matrix.gpu }}
          FERNSICHT_REQUIRE_VULKAN: "1"
        run: >
          cargo test -p fernsicht-render
          --features "vulkan,vulkan-video${{ matrix.gpu == 'amd' && ',vaapi' || ',nvidia' }}"
          --test vulkan -- --test-threads=1 --nocapture
      - name: Screen to NV12 in Vulkan (DMA-BUF import, BT.709, scaling)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          FERNSICHT_REQUIRE_VULKAN: "1"
          FERNSICHT_REQUIRE_DMABUF: "1"
        run: cargo test -p fernsicht-gpu -- --test-threads=1 --nocapture
      - name: VAAPI encode/decode on the GPU
        if: ${{ !cancelled() && matrix.gpu == 'amd' }}
        timeout-minutes: 10
        env:
          FERNSICHT_GPU: amd
        run: cargo test -p fernsicht-codec --features vaapi --test vaapi -- --test-threads=1 --nocapture
      # Vulkan Video through FFmpeg on our own device, on both GPUs (each
      # test skips what its driver does not do).
      - name: Vulkan Video encode/decode on the GPU
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          FERNSICHT_GPU: ${{ matrix.gpu }}
        run: >
          scripts/annotate-failures.sh
          cargo test -p fernsicht-codec --features vulkan --test vulkan -- --test-threads=1 --nocapture
      - name: Real video end to end (host → impaired link → client; web viewer)
        if: ${{ !cancelled() && matrix.gpu == 'amd' }}
        timeout-minutes: 10
        env:
          FERNSICHT_GPU: amd
        run: >
          scripts/annotate-failures.sh
          cargo test -p fernsicht-e2e --features vaapi,vulkan --no-fail-fast --test gpu --test web_gpu -- --nocapture
      - name: NVENC/NVDEC on the GPU
        if: ${{ !cancelled() && matrix.gpu == 'nvidia' }}
        timeout-minutes: 10
        env:
          FERNSICHT_GPU: nvidia
        run: cargo test -p fernsicht-codec --features nvidia --test nvidia -- --test-threads=1 --nocapture
      - name: Real video end to end (NVENC → impaired link → NVDEC; web viewer)
        if: ${{ !cancelled() && matrix.gpu == 'nvidia' }}
        timeout-minutes: 10
        env:
          FERNSICHT_GPU: nvidia
        run: >
          scripts/annotate-failures.sh
          cargo test -p fernsicht-e2e --features nvidia,vulkan --no-fail-fast --test gpu --test web_gpu -- --nocapture
