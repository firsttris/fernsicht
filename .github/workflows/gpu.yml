name: GPU

# Runs on the self-hosted runners on the owner's machines (docs/gpu-runner.md).
# Self-hosted runners execute repository code locally, so this workflow
# never runs for pull requests (forks included): only for pushes to main by
# people with write access, nightly, and on demand.
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "apps/**"
      - "tests/**"
      - "Cargo.*"
      - "dev/**"
      - ".github/workflows/gpu.yml"
  schedule:
    # Nightly, to catch Mesa/NVIDIA driver updates that break GPU code.
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gpu:
    name: GPU · ${{ matrix.gpu }}
    if: github.repository == 'firsttris/fernsicht' && github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        # Machines with a runner, as a repository variable (Settings →
        # Secrets and variables → Actions → Variables), e.g. ["amd","nvidia"].
        # Without it only the AMD machine is used, so no job waits for a
        # runner that does not exist yet.
        gpu: ${{ fromJSON(vars.GPU_RUNNERS || '["amd"]') }}
    # A machine that is switched off leaves its job queued (GitHub gives up
    # after 24 h); cancel it in the Actions tab if you don't need it.
    runs-on: [self-hosted, linux, "gpu-${{ matrix.gpu }}"]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: GPU capabilities and hardware H.264 smoke test
        run: dev/gpu-check.sh --expect ${{ matrix.gpu }} --summary "$GITHUB_STEP_SUMMARY"
      - name: Tests on this machine
        run: cargo test --workspace --exclude fernsicht-e2e
      # AMD: decoded pictures shown without a copy (DMA-BUF import);
      # NVIDIA: the CPU upload path on the proprietary driver.
      - name: Vulkan renderer on this GPU
        env:
          FERNSICHT_GPU: ${{ matrix.gpu }}
          FERNSICHT_REQUIRE_VULKAN: "1"
        run: >
          cargo test -p fernsicht-render
          --features "vulkan${{ matrix.gpu == 'amd' && ',vaapi' || '' }}"
          --test vulkan -- --test-threads=1 --nocapture
      - name: VAAPI encode/decode on the GPU
        if: matrix.gpu == 'amd'
        env:
          FERNSICHT_GPU: amd
        run: cargo test -p fernsicht-codec --features vaapi --test vaapi -- --test-threads=1 --nocapture
      - name: Real H.264 end to end (host → impaired link → client)
        if: matrix.gpu == 'amd'
        env:
          FERNSICHT_GPU: amd
        run: cargo test -p fernsicht-e2e --features vaapi --test gpu -- --nocapture
      - name: NVENC/NVDEC on the GPU
        if: matrix.gpu == 'nvidia'
        env:
          FERNSICHT_GPU: nvidia
        run: cargo test -p fernsicht-codec --features nvidia --test nvidia -- --test-threads=1 --nocapture
      - name: Real H.264 end to end (NVENC → impaired link → NVDEC)
        if: matrix.gpu == 'nvidia'
        env:
          FERNSICHT_GPU: nvidia
        run: cargo test -p fernsicht-e2e --features nvidia --test gpu -- --nocapture
