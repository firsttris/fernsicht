name: Release

# A tag vX.Y.Z (from the "Bump version" button or pushed from a checkout)
# runs the checks (unless main's CI already ran them), builds
# Fernsicht.AppImage (the app, the stream window, the host and the web viewer
# in one file) and the host alone for servers (an archive with install.sh, a
# .deb and an .rpm), installs those on Arch, Fedora, Debian and Ubuntu, and
# creates the GitHub release with all of it.
# Run by hand on a branch it only checks and builds (no release), e.g. to try
# the packaging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A release commit from "Bump version" changes only the version numbers:
  # main's CI already tested the code, so the checks are not run again.
  tested:
    uses: firsttris/workflows/.github/workflows/tested-on-main.yml@v1
    permissions:
      actions: read
      contents: read

  checks:
    needs: tested
    if: needs.tested.outputs.tested != 'true'
    uses: ./.github/workflows/ci.yml

  build:
    name: Build · AppImage, host packages
    needs: [tested, checks]
    # The checks either passed or were not needed.
    if: ${{ !cancelled() && needs.tested.result == 'success' && needs.checks.result != 'failure' }}
    # An old Ubuntu: the AppImage runs on distributions with this glibc or
    # newer. Its FFmpeg (6.1) is too old for Vulkan Video, so the AppImage
    # carries one of its own (packaging/ffmpeg.sh).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System packages (VAAPI, udev for SDL, WebKitGTK for the bundler)
        uses: firsttris/workflows/actions/apt-install@v1
        with:
          recommends: "false"
          packages: >-
            libva-dev libdrm-dev libudev-dev cmake
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev
            libjavascriptcoregtk-4.1-dev patchelf file
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable branch, 2026-09-11
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            apps/desktop
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # Built once per version (the script's content), then from the cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ffmpeg
          key: ffmpeg-ubuntu-24.04-${{ hashFiles('packaging/ffmpeg.sh') }}
      - run: ./packaging/ffmpeg.sh target/ffmpeg
      # SDL3 for the client's gamepads (appimage.sh takes it from here).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/sdl3
          key: sdl3-ubuntu-24.04-${{ hashFiles('packaging/sdl3.sh') }}
      - run: ./packaging/sdl3.sh target/sdl3
      # The programs link against it, and the bundler takes it along.
      - run: ./packaging/appimage.sh
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/target/ffmpeg/lib/pkgconfig
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/ffmpeg/lib
      # nfpm makes the .deb and the .rpm. A fixed release, checked by Go's
      # checksum database (sum.golang.org) as it is fetched; it needs a newer
      # Go than the runner's, which GOTOOLCHAIN fetches the same way.
      - name: nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
        env:
          GOTOOLCHAIN: auto
          GOBIN: ${{ runner.temp }}/bin
      # The host just built for the AppImage, alone: archive, .deb, .rpm.
      - run: ./packaging/host-bundle.sh target/host-bundle
        env:
          NFPM: ${{ runner.temp }}/bin/nfpm
      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir -p dist
          cp apps/desktop/target/release/bundle/appimage/Fernsicht-*.AppImage dist/
          cp target/host-bundle/fernsicht-host-*.tar.gz target/host-bundle/*.deb \
            target/host-bundle/*.rpm target/host-bundle/install.sh dist/
          # install.sh checks its download against this.
          (cd dist && sha256sum -- * > SHA256SUMS)
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # The host's packages on fresh distributions, installed as a user would:
  # through install.sh (piped into sh), and as a .deb or .rpm
  # (packaging/test-host-package.sh).
  host-packages:
    name: Install · ${{ matrix.image }}
    needs: build
    # Without a status function the implicit success() also counts the
    # skipped `checks` job (a release commit main's CI already tested) and
    # skips this job and the release after it.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ["archlinux:latest", "fedora:latest", "debian:stable", "ubuntu:24.04"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: sh packaging/test-host-package.sh dist

  release:
    needs: [build, host-packages]
    # Run by hand on a branch: only checks and build. !cancelled() for the
    # same reason as host-packages.
    if: >-
      ${{ !cancelled() && needs.build.result == 'success'
      && needs.host-packages.result == 'success'
      && startsWith(github.ref, 'refs/tags/v') }}
    uses: firsttris/workflows/.github/workflows/github-release.yml@v1
    with:
      version-file: Cargo.toml
      release-artifact: dist
      notes: |
        Download **Fernsicht-<Version>-x86_64.AppImage**, make it executable and start it:
        on the computer you connect from, and on the computer you want to control (there,
        under “Dieser Rechner”, click “Diesen Rechner freigeben” – share this computer).
        On a server without a screen at hand, over SSH, the host alone:
        `curl -fsSL https://github.com/firsttris/fernsicht/releases/latest/download/install.sh | sudo sh`
        (or the .deb / .rpm).
        Guide: https://firsttris.github.io/fernsicht/installation.html
    permissions:
      contents: write
