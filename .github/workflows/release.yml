name: Release

# A tag vX.Y.Z (from the "Bump version" button or pushed from a checkout)
# runs the checks, builds Fernsicht.AppImage (the app, the stream window, the
# host and the web viewer in one file) and creates the GitHub release with it.
# Run by hand on a branch it only checks and builds (no release), e.g. to try
# the packaging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build · AppImage
    needs: checks
    # The oldest Ubuntu the app builds on (FFmpeg 6.1): the AppImage then
    # runs on distributions with this glibc or newer.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System packages (FFmpeg, VAAPI, WebKitGTK for the bundler)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev libavdevice-dev \
            libswscale-dev libswresample-dev libva-dev libdrm-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev patchelf file
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable branch, 2026-09-11
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            apps/desktop
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: ./packaging/appimage.sh
      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir -p dist
          cp apps/desktop/target/release/bundle/appimage/Fernsicht-*.AppImage dist/
          (cd dist && sha256sum -- * > SHA256SUMS)
          ls -l dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') # run by hand on a branch: only checks and build
    uses: firsttris/workflows/.github/workflows/github-release.yml@v1
    with:
      version-file: Cargo.toml
      release-artifact: dist
      notes: |
        Download **Fernsicht-<Version>-x86_64.AppImage**, make it executable and start it:
        on the computer you connect from, and on the computer you want to control (there,
        under “Dieser Rechner”, click “Diesen Rechner freigeben” – share this computer).
        Guide: https://firsttris.github.io/fernsicht/installation.html
    permissions:
      contents: write
