name: Update screenshots

# Takes the pictures in docs/ (README, documentation, banner, social preview) from the demo data
# with scripts/screenshots.sh and commits the ones that changed. Run it after a change to the look.
on:
  workflow_dispatch:

jobs:
  screenshots:
    uses: firsttris/workflows/.github/workflows/screenshots.yml@v1
    with:
      # The npm package brings Bun without unzip, which the Playwright image lacks; node reads its
      # version from packageManager in package.json (the image has no jq), as setup-bun does in CI
      install: >-
        npm install --global "bun@$(node -p "require('./package.json').packageManager.split('@')[1]")"
        && bun install --frozen-lockfile
      lockfile: bun.lock
      command: bun run screenshots
      paths: |
        docs/screenshot-*.png
        docs/social-preview.png
        docs/banner.png
    permissions:
      contents: write
