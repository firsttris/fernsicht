[workspace]
resolver = "3"
members = ["crates/*", "apps/host-agent", "apps/client", "apps/rendezvous", "tests/e2e"]
# Fuzz targets need nightly and cargo-fuzz (fuzz/README.md); the desktop app
# needs WebKitGTK and the built UI (apps/desktop/Cargo.toml).
exclude = ["fuzz", "apps/desktop"]

[workspace.package]
version = "0.1.6"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/firsttris/fernsicht"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
fernsicht-core = { path = "crates/core" }
fernsicht-proto = { path = "crates/proto" }
fernsicht-net = { path = "crates/net" }
fernsicht-capture = { path = "crates/capture" }
fernsicht-codec = { path = "crates/codec" }
fernsicht-gpu = { path = "crates/gpu" }
fernsicht-render = { path = "crates/render" }
fernsicht-shader = { path = "crates/shader" }
fernsicht-input = { path = "crates/input" }
fernsicht-audio = { path = "crates/audio" }
fernsicht-secure = { path = "crates/secure" }
fernsicht-clipboard = { path = "crates/clipboard" }
fernsicht-internet = { path = "crates/internet" }
fernsicht-host-agent = { path = "apps/host-agent" }
fernsicht-client = { path = "apps/client" }
fernsicht-rendezvous = { path = "apps/rendezvous" }

anyhow = "1"
base64 = "0.22"
chacha20poly1305 = "0.10"
ash = "0.38"
ash-window = "0.13"
clap = { version = "4", features = ["derive"] }
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format"] }
# Only for its FFmpeg version flags (build scripts); the API is ffmpeg-next's.
ffmpeg-sys-next = { version = "9", default-features = false }
crossbeam-channel = "0.5"
drm = "0.15"
libc = "0.2"
libloading = "0.9"
log = "0.4"
naga = { version = "30", features = ["wgsl-in", "spv-out"] }
raw-window-handle = "0.6"
env_logger = "0.11"
getrandom = "0.3"
hmac = "0.12"
md-5 = "0.10"
reed-solomon-simd = "3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
snow = "0.10"
# TLS for the rendezvous service's WebSockets; ring as the one crypto
# provider (no C toolchain for aws-lc).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# WebRTC for the web viewer; pure-Rust crypto (no C toolchain for aws-lc).
str0m = { version = "0.24", default-features = false, features = ["rust-crypto"] }
spake2 = "0.4"
socket2 = "0.6"
thiserror = "2"
# TypeScript types for the app and the web viewer, from the Rust ones.
ts-rs = "12.0.1"
winit = "0.30"
# The client window asks the compositor to pass system shortcuts on
# (keyboard-shortcuts-inhibit), on winit's own Wayland connection.
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable", "staging"] }
# The clipboard on compositors that offer only wlroots' data control.
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
x11-dl = "2.21"
# Key agreement for the rendezvous service's key proof.
x25519-dalek = { version = "2", features = ["static_secrets"] }

# WebSockets to the rendezvous service (and its own server side).
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

# test-only
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
escargot = "0.5"
proptest = "1.11"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Optimize dependencies (Reed-Solomon, proptest) in dev/test builds so the
# test suite and the E2E scenarios run at realistic speed.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
