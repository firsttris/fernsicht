[workspace]
resolver = "2"
members = ["crates/*", "apps/host-agent", "apps/client", "tests/e2e"]
# Fuzz targets need nightly and cargo-fuzz (fuzz/README.md); the desktop app
# needs WebKitGTK and the built UI (apps/desktop/Cargo.toml).
exclude = ["fuzz", "apps/desktop"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/firsttris/fernsicht"
publish = false

[workspace.dependencies]
fernsicht-core = { path = "crates/core" }
fernsicht-proto = { path = "crates/proto" }
fernsicht-net = { path = "crates/net" }
fernsicht-capture = { path = "crates/capture" }
fernsicht-codec = { path = "crates/codec" }
fernsicht-gpu = { path = "crates/gpu" }
fernsicht-render = { path = "crates/render" }
fernsicht-input = { path = "crates/input" }
fernsicht-audio = { path = "crates/audio" }
fernsicht-secure = { path = "crates/secure" }
fernsicht-host-agent = { path = "apps/host-agent" }
fernsicht-client = { path = "apps/client" }

anyhow = "1"
chacha20poly1305 = "0.10"
ash = "0.38"
ash-window = "0.13"
clap = { version = "4", features = ["derive"] }
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format"] }
crossbeam-channel = "0.5"
drm = "0.15"
libc = "0.2"
libloading = "0.8"
log = "0.4"
naga = { version = "30", features = ["wgsl-in", "spv-out"] }
raw-window-handle = "0.6"
env_logger = "0.11"
getrandom = "0.3"
reed-solomon-simd = "3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snow = "0.10"
# WebRTC for the web viewer; pure-Rust crypto (no C toolchain for aws-lc).
str0m = { version = "0.24", default-features = false, features = ["rust-crypto"] }
tiny_http = "0.12"
spake2 = "0.4"
socket2 = "0.6"
thiserror = "2"
winit = "0.30"

# test-only
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
escargot = "0.5"
proptest = "1.11"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Optimize dependencies (Reed-Solomon, proptest) in dev/test builds so the
# test suite and the E2E scenarios run at realistic speed.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
