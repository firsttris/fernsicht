[package]
name = "fernsicht-client"
description = "Native client: receive, reassemble, decode, present, latency overlay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "fernsicht-client"
path = "src/main.rs"

[features]
# Hardware H.264 over VAAPI (AMD, Intel); needs FFmpeg/libva headers.
vaapi = ["fernsicht-codec/vaapi"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
crossbeam-channel.workspace = true
env_logger.workspace = true
fernsicht-codec.workspace = true
fernsicht-core.workspace = true
fernsicht-net.workspace = true
fernsicht-proto.workspace = true
fernsicht-render.workspace = true
log.workspace = true

[dev-dependencies]
fernsicht-capture.workspace = true

[lints]
workspace = true
