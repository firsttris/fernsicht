[package]
name = "fernsicht-client"
description = "Native client: receive, reassemble, decode, present, latency overlay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "fernsicht-client"
path = "src/main.rs"

[features]
# Hardware H.264 over VAAPI (AMD, Intel); needs FFmpeg/libva headers.
vaapi = ["fernsicht-codec/vaapi"]
# Hardware H.264 decoding with NVDEC (NVIDIA); CUDA is loaded at runtime.
nvidia = ["fernsicht-codec/nvidia"]
# The video window (Vulkan via ash, winit); without it the client is
# headless and prints the overlay only.
window = ["fernsicht-render/window", "dep:winit"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
crossbeam-channel.workspace = true
env_logger.workspace = true
fernsicht-audio.workspace = true
fernsicht-capture.workspace = true
fernsicht-codec.workspace = true
fernsicht-core.workspace = true
fernsicht-input.workspace = true
fernsicht-net.workspace = true
fernsicht-proto.workspace = true
fernsicht-secure.workspace = true
fernsicht-render.workspace = true
log.workspace = true
winit = { workspace = true, optional = true }

[dev-dependencies]

[lints]
workspace = true
