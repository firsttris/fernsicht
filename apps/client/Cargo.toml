[package]
name = "fernsicht-client"
description = "Native client: receive, reassemble, decode, present, latency overlay"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "fernsicht-client"
path = "src/main.rs"

[features]
# Hardware AV1, HEVC and H.264 over VAAPI (AMD, Intel); needs FFmpeg/libva
# headers.
vaapi = ["fernsicht-codec/vaapi"]
# Hardware AV1, HEVC and H.264 decoding with NVDEC (NVIDIA); CUDA is loaded at
# runtime.
nvidia = ["fernsicht-codec/nvidia"]
# Hardware AV1, HEVC and H.264 decoding with Vulkan Video (any GPU whose
# driver has it), on the window's own Vulkan device; needs FFmpeg with Vulkan.
vulkan = ["fernsicht-codec/vulkan", "fernsicht-render/vulkan", "dep:fernsicht-gpu"]
# The video window (Vulkan via ash, winit); without it the client is
# headless and prints the overlay only.
window = [
    "fernsicht-render/window",
    "dep:winit",
    "dep:raw-window-handle",
    "dep:wayland-backend",
    "dep:wayland-client",
    "dep:wayland-protocols",
    "dep:x11-dl",
]
# TypeScript types of what goes to the app and the web viewer (ts-rs).
ts = ["dep:ts-rs", "fernsicht-render/ts"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
ts-rs = { workspace = true, optional = true }
clap.workspace = true
crossbeam-channel.workspace = true
env_logger.workspace = true
fernsicht-audio.workspace = true
fernsicht-capture.workspace = true
fernsicht-codec.workspace = true
fernsicht-gpu = { workspace = true, optional = true }
fernsicht-core.workspace = true
fernsicht-input = { workspace = true, features = ["gamepad"] }
fernsicht-clipboard.workspace = true
fernsicht-net.workspace = true
libc.workspace = true
fernsicht-proto.workspace = true
fernsicht-secure.workspace = true
fernsicht-render.workspace = true
log.workspace = true
winit = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }
wayland-backend = { workspace = true, optional = true }
wayland-client = { workspace = true, optional = true }
wayland-protocols = { workspace = true, optional = true }
x11-dl = { workspace = true, optional = true }

[dev-dependencies]

[lints]
workspace = true
