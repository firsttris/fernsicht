[package]
name = "fernsicht-desktop"
description = "The Fernsicht app: devices in the LAN, pairing, sessions (Tauri around apps/client-ui)"
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
publish = false

# Not in the main workspace (see its `exclude`): Tauri needs WebKitGTK and
# the built UI (apps/client-ui/dist), which the other crates' builds and
# CI jobs should not. Built and tested by its own CI job.

[[bin]]
name = "fernsicht"
path = "src/main.rs"

[features]
# Serve the built UI from the binary (the default). For UI work with hot
# reload: `pnpm dev:client`, then `cargo run --no-default-features`, which
# loads the Vite dev server instead.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
env_logger = "0.11"
fernsicht-client = { path = "../client" }
fernsicht-host-agent = { path = "../host-agent" }
fernsicht-secure = { path = "../../crates/secure" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dev-dependencies]
escargot = "0.5"
