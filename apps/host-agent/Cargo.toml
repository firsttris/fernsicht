[package]
name = "fernsicht-host-agent"
description = "Per-session host agent: capture, encode, FEC, paced UDP send"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "fernsicht-host-agent"
path = "src/main.rs"

[features]
# Hardware H.264 over VAAPI (AMD, Intel); needs FFmpeg/libva headers.
vaapi = ["fernsicht-codec/vaapi"]
# Hardware H.264 with NVENC (NVIDIA); CUDA is loaded at runtime.
nvidia = ["fernsicht-codec/nvidia"]
# Screen capture over KMS (needs CAP_SYS_ADMIN at runtime).
kms = ["fernsicht-capture/kms"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
crossbeam-channel.workspace = true
env_logger.workspace = true
fernsicht-audio.workspace = true
fernsicht-capture.workspace = true
fernsicht-codec.workspace = true
fernsicht-core.workspace = true
fernsicht-input = { workspace = true, features = ["uinput"] }
fernsicht-net.workspace = true
fernsicht-proto.workspace = true
fernsicht-secure.workspace = true
libc.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
str0m.workspace = true
tiny_http.workspace = true

[dev-dependencies]
fernsicht-input.workspace = true

[lints]
workspace = true
