[package]
name = "fernsicht-codec"
description = "Video encoder/decoder traits and backends"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# AV1, HEVC and H.264 over VAAPI via FFmpeg (AMD radeonsi, Intel iHD).
# Needs the FFmpeg and libva development packages; see dev/Containerfile.
vaapi = ["dep:ffmpeg-next", "ffmpeg-next/filter", "dep:libc", "dep:log"]
# AV1, HEVC and H.264 with NVENC/NVDEC via FFmpeg (CUDA is loaded at
# runtime, so this builds without the NVIDIA driver). Screen input goes
# through Vulkan.
nvidia = ["dep:ffmpeg-next", "dep:libc", "dep:libloading", "dep:log", "dep:fernsicht-gpu"]
# AV1, HEVC and H.264 with Vulkan Video via FFmpeg, on our own Vulkan
# device (any GPU whose driver has it). Needs FFmpeg built with Vulkan.
vulkan = [
    "dep:ffmpeg-next",
    "dep:ffmpeg-sys-next",
    "dep:libc",
    "dep:log",
    "dep:fernsicht-gpu",
    "dep:ash",
]

[dependencies]
ash = { workspace = true, optional = true }
ffmpeg-next = { workspace = true, optional = true }
ffmpeg-sys-next = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
fernsicht-capture.workspace = true
fernsicht-gpu = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }
log = { workspace = true, optional = true }
fernsicht-core.workspace = true
fernsicht-proto.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The NVIDIA tests put RGB pictures on the GPU as DMA-BUFs.
fernsicht-gpu.workspace = true
proptest.workspace = true

[lints]
workspace = true
