[package]
name = "fernsicht-input"
description = "Input events: reliable delivery and injection (uinput)"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Virtual keyboard and mice through /dev/uinput (host side).
uinput = ["dep:libc", "dep:log"]
# The client's gamepads, through SDL3 (loaded at runtime) or evdev (client
# side).
gamepad = ["dep:libc", "dep:log", "dep:fernsicht-core", "dep:libloading"]

[dependencies]
fernsicht-core = { workspace = true, optional = true }
fernsicht-proto.workspace = true
libc = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }
log = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
libloading.workspace = true
