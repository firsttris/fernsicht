# Created by dev/setup.sh (do not run `distrobox assemble` on it directly:
# setup.sh builds the image first).
#
# The box shares your home directory and /dev with the host, so the GPU
# (/dev/dri, and on NVIDIA the driver libraries) is available inside.

[fernsicht]
image=localhost/fernsicht-dev:latest
pull=false
init=false
nvidia=false

# NVIDIA hosts: mounts the host's NVIDIA driver libraries into the box.
[fernsicht-nvidia]
image=localhost/fernsicht-dev:latest
pull=false
init=false
nvidia=true

# Rootful box (dev/setup.sh --root): `sudo` inside is real root, which KMS
# capture needs. Only for running the host agent; develop in `fernsicht`.
[fernsicht-root]
image=localhost/fernsicht-dev:latest
pull=false
init=false
nvidia=false
root=true
