# Documentation as a website: https://firsttris.github.io/fernsicht/
# Source is docs/, built with MkDocs Material (.github/workflows/docs.yml).
# Locally: pip install -r requirements-docs.txt && mkdocs serve
site_name: Fernsicht
site_description: >-
  Low-latency remote desktop and game streaming for Linux: KMS capture, hardware
  encoding with VAAPI and NVENC (AV1, HEVC, H.264), Vulkan display, about 10 ms in
  the LAN. Self-hosted, written in Rust.
site_url: https://firsttris.github.io/fernsicht/
repo_url: https://github.com/firsttris/fernsicht
repo_name: firsttris/fernsicht
edit_uri: edit/main/docs/
copyright: License AGPL-3.0

docs_dir: docs
# Pages as video.html instead of video/: keeps the relative image paths right,
# which also have to work on GitHub
use_directory_urls: false
exclude_docs: |
  social-preview.png
# --strict also fails on links to missing headings
validation:
  anchors: warn

nav:
  - Overview: README.md
  - Getting started:
      - Status: status.md
      - Installation: installation.md
      - Remote access: remote-access.md
  - Using it:
      - The app: app.md
      - Web viewer: web-viewer.md
      - Command line: command-line.md
      - KMS capture: kms-capture.md
  - How it works:
      - Architecture: architecture.md
      - Modules: modules.md
      - Video path: video.md
      - Protocol: protocol.md
      - Security: security.md
  - Performance:
      - Performance: performance.md
      - Latency baseline: latency-baseline.md
      - Next steps: next-steps.md
  - Development:
      - Development: development.md
      - Testing: testing.md
      - GPU runner: gpu-runner.md
      - Handover notes: handover.md

theme:
  name: material
  language: en
  logo: assets/icon.svg
  favicon: assets/icon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    # Follows the system setting, switchable
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
    - content.action.edit
    - content.tabs.link

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search:
      lang: en
  - git-revision-date-localized:
      type: date
      locale: en
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # Same anchors as on GitHub (lowercase, Unicode kept)
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/firsttris/fernsicht
      name: Source on GitHub
    - icon: material/download
      link: https://github.com/firsttris/fernsicht/releases/latest
      name: Latest release
