[package]
name = "fernsicht-e2e"
description = "End-to-end tests: host agent and client through an impaired network link"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# GPU end-to-end tests (tests/gpu.rs); run on the self-hosted AMD runner.
vaapi = ["fernsicht-host-agent/vaapi", "fernsicht-client/vaapi"]
# The same on the NVIDIA runner, with NVENC/NVDEC.
nvidia = ["fernsicht-host-agent/nvidia", "fernsicht-client/nvidia"]

[dependencies]
fernsicht-client.workspace = true
fernsicht-core.workspace = true
fernsicht-audio.workspace = true
fernsicht-host-agent.workspace = true
fernsicht-input.workspace = true
fernsicht-net.workspace = true
fernsicht-proto.workspace = true

[dev-dependencies]
escargot.workspace = true
serde_json.workspace = true
str0m.workspace = true

[lints]
workspace = true
